[theme]
base = "dark"
primaryColor = "#c17a3a"
backgroundColor = "#161411"
secondaryBackgroundColor = "#221e19"
textColor = "#e8e1d5"
font = "sans serif"

[server]
headless = true
port = 8501
address = "127.0.0.1"
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[global]
developmentMode = false
